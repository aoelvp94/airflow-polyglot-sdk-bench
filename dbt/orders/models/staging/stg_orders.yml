version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [placed, paid, shipped, delivered, returned, cancelled]
      - name: amount
        data_tests: [not_null]
